name: Check Code.

on:
  workflow_dispatch:
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spotless-check:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          java: 21
          arch: arm64
          runner: ubuntu-24.04-arm
          expander_leg: ubuntu-latest-21-arm64
    if: github.repository =='DTStack/chunjun'
    name: Check code style with spotless. [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: true
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'
    - name: Spotless Check
      run: |
        ./mvnw spotless:check

